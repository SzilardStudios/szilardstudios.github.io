<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Road Radio Bridge</title>
</head>
<body style="margin:0; background:#000;">
<div id="yt-player-iframe"></div>
<script>
  // Road Radio — bridge page
  //
  // This page exists for one reason: a Chrome extension page can never
  // properly embed YouTube directly (extension pages don't send a normal
  // web Referrer header, and YouTube requires one to identify the
  // embedder — without it, videos are marked unplayable). A real webpage
  // like this one doesn't have that restriction, so it does the actual
  // embedding, and just relays play/pause/skip/mute/state back and forth
  // with the extension via postMessage.

  var ytPlayer;
  var radioPlaylistId = 'PLXLXsLMekRqM';      // "Road Radio" — the full curated catalog
  var newReleasePlaylistId = 'PLPqJjW2SrebE'; // "New Release" — always the current album
  var radioInNewRelease = false;

  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function loadYTAPI() {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  }

  window.onYouTubeIframeAPIReady = function () {
    var startMuted = getQueryParam('muted') !== 'false'; // default true

    ytPlayer = new YT.Player('yt-player-iframe', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: radioPlaylistId,
        autoplay: 1,
        mute: startMuted ? 1 : 0,
        controls: 0,
        disablekb: 1,
        playsinline: 1,
        rel: 0,
        loop: 1
      },
      events: {
        'onReady': function (event) {
          event.target.setShuffle(true);
          if (startMuted) {
            event.target.mute();
          } else {
            event.target.unMute();
          }
          event.target.playVideo();
          broadcastState();
          startTrackWatcher();
        },
        'onStateChange': onPlayerStateChange,
        'onError': function (event) {
          if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
        }
      }
    });
  };

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      broadcastState();
    } else if (event.data === YT.PlayerState.PAUSED) {
      broadcastState();
    } else if (event.data === YT.PlayerState.CUED) {
      broadcastState();
    }
  }

  // YouTube's own playlist+loop auto-advance moves from one video straight
  // to the next internally without reliably firing a distinct "ended"
  // state in between — so waiting for that event to inject a New Release
  // track never actually triggers. Instead, poll for the video ID itself
  // changing, which catches every track change regardless of how it happened.
  var lastKnownVideoId = null;
  var suppressUntil = 0; // timestamp — ignore all changes until this passes,
                          // since a deliberate playlist switch can cause more
                          // than one rapid video_id flicker, not just one

  function startTrackWatcher() {
    setInterval(function () {
      if (!ytPlayer || !ytPlayer.getVideoData) return;
      var data = ytPlayer.getVideoData();
      var vid = data && data.video_id;
      if (!vid) return;
      if (lastKnownVideoId === null) {
        lastKnownVideoId = vid;
        return;
      }
      if (vid !== lastKnownVideoId) {
        lastKnownVideoId = vid;
        if (Date.now() < suppressUntil) {
          console.log('[Bridge] change ignored (within cooldown after our own switch)');
          return;
        }
        handleTrackChanged();
      }
    }, 2000);
  }

  function switchTo(playlistId, label) {
    console.log('[Bridge] switching to', label, '(' + playlistId + ')');
    suppressUntil = Date.now() + 6000; // ignore the next 6s of changes — long
                                        // enough to absorb any flicker from the switch itself
    // cuePlaylist() proved unreliable when called on an already-playing
    // player — it would silently keep playing whatever was already loaded.
    // loadPlaylist() loads AND plays in one atomic step, which actually
    // forces the switch to take effect.
    ytPlayer.loadPlaylist({ list: playlistId, listType: 'playlist' });
    ytPlayer.setShuffle(true);
    // Verify what actually loaded, for diagnosis.
    setTimeout(function () {
      if (ytPlayer && ytPlayer.getPlaylist) {
        var list = ytPlayer.getPlaylist();
        console.log('[Bridge] after switching to', label, '— actual loaded playlist has', list ? list.length : 0, 'videos, first ID:', list && list[0]);
      }
    }, 1500);
  }

  function handleTrackChanged() {
    if (!ytPlayer || !ytPlayer.cuePlaylist) return;
    if (radioInNewRelease) {
      console.log('[Bridge] finished a New Release track, rejoining Road Radio');
      radioInNewRelease = false;
      switchTo(radioPlaylistId, 'Road Radio');
      return;
    }
    var roll = Math.random();
    console.log('[Bridge] weighted roll:', roll.toFixed(3), roll < 0.2 ? '-> NEW RELEASE' : '-> staying on Road Radio');
    if (roll < 0.2) {
      radioInNewRelease = true;
      switchTo(newReleasePlaylistId, 'New Release');
    }
    // If the roll misses, do nothing — the current track is already
    // playing fine on its own via the native playlist advance.
  }

  function broadcastState() {
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    var data = ytPlayer.getVideoData ? ytPlayer.getVideoData() : {};
    var state = ytPlayer.getPlayerState();
    if (data && data.title) {
      console.log('[Bridge] now playing:', data.title, '| in New Release mode:', radioInNewRelease);
    }
    sendToParent({
      type: 'state',
      playing: state === YT.PlayerState.PLAYING,
      muted: ytPlayer.isMuted ? ytPlayer.isMuted() : true,
      title: data && data.title ? data.title : 'Tuning in...',
      videoId: data && data.video_id ? data.video_id : null
    });
  }

  function sendToParent(message) {
    if (window.parent) {
      window.parent.postMessage(message, '*');
    }
  }

  var userPaused = false;

  window.addEventListener('message', function (event) {
    var msg = event.data;
    if (!msg || !msg.cmd || !ytPlayer) return;

    if (msg.cmd === 'toggle-play') {
      var state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        userPaused = true;
        ytPlayer.pauseVideo();
      } else {
        userPaused = false;
        ytPlayer.playVideo();
      }
    } else if (msg.cmd === 'next') {
      ytPlayer.nextVideo();
    } else if (msg.cmd === 'toggle-mute') {
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
      } else {
        ytPlayer.mute();
      }
      broadcastState();
    } else if (msg.cmd === 'request-state') {
      broadcastState();
    }
  });

  // Self-healing watchdog — if playback isn't PLAYING and the user didn't
  // deliberately pause it, something went wrong internally. Force a clean
  // recovery onto Road Radio rather than leaving the radio silently dead.
  var lastPlayingAt = Date.now();
  setInterval(function () {
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
      lastPlayingAt = Date.now();
      return;
    }
    if (userPaused) return;
    if (Date.now() - lastPlayingAt > 20000) {
      console.log('[Bridge] watchdog: no playback for 20s and not user-paused — recovering');
      lastPlayingAt = Date.now();
      radioInNewRelease = false;
      switchTo(radioPlaylistId, 'Road Radio (recovery)');
    }
  }, 5000);

  loadYTAPI();
</script>
</body>
</html>
